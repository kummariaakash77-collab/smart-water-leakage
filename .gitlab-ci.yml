stages:
  - format
  - lint
  - type_check
  - quality
  - security
  - test
  - coverage

# --------------------
# FORMAT
# --------------------
format:
  stage: format
  image: python:3.12
  script:
    - pip install ruff
    - ruff format --check .

# --------------------
# LINT
# --------------------
lint:
  stage: lint
  image: python:3.12
  script:
    - pip install ruff
    - ruff check .

# --------------------
# DEPENDENCY AUDIT
# --------------------
dependency_audit:
  stage: lint
  image: python:3.12
  script:
    - pip install pip-audit
    - pip-audit

# --------------------
# TYPE CHECK
# --------------------
type_check:
  stage: type_check
  image: python:3.12
  script:
    - pip install mypy
    - mypy .

# --------------------
# QUALITY (UPDATED - FIXED PYUPGRADE)
# --------------------
quality:
  stage: quality
  image: python:3.12
  script:
    - pip install pylint flake8 vulture pyupgrade
    - pylint app.py || true
    - flake8 . || true
    - vulture app.py || true
    - pyupgrade --py312-plus app.py || true

# --------------------
# SECURITY EXTENDED
# --------------------
security_extended:
  stage: security
  image: python:3.12
  script:
    - pip install semgrep
    - semgrep --config=auto . || true

# --------------------
# TEST
# --------------------
test:
  stage: test
  image: python:3.12
  script:
    - pip install pytest
    - pytest

# --------------------
# COVERAGE
# --------------------
coverage:
  stage: coverage
  image: python:3.12
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. --cov-report=term