stages:
  - format
  - lint
  - type_check
  - quality
  - security
  - test
  - coverage

default:
  image: python:3.12
  cache:
    paths:
      - .cache/pip

before_script:
  - python -m pip install --upgrade pip

# --------------------
# FORMAT
# --------------------
format:
  stage: format
  script:
    - pip install ruff
    - ruff format --check . || true

# --------------------
# LINT
# --------------------
lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check . || true

# --------------------
# DEPENDENCY AUDIT
# --------------------
dependency_audit:
  stage: lint
  script:
    - pip install pip-audit
    - pip-audit || true

# --------------------
# TYPE CHECK
# --------------------
type_check:
  stage: type_check
  script:
    - pip install mypy
    - mypy . || true

# --------------------
# QUALITY
# --------------------
quality:
  stage: quality
  script:
    - pip install pylint flake8 vulture pyupgrade
    - pylint app.py || true
    - flake8 . || true
    - vulture . || true
    - pyupgrade --py312-plus app.py || true

# --------------------
# SECURITY EXTENDED
# --------------------
security_extended:
  stage: security
  script:
    - pip install semgrep
    - semgrep --config=auto . || true

# --------------------
# TEST
# --------------------
test:
  stage: test
  script:
    - pip install pytest
    - pytest || true

# --------------------
# COVERAGE
# --------------------
coverage:
  stage: coverage
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. --cov-report=term || true
  artifacts:
    when: always
    expire_in: 1 week